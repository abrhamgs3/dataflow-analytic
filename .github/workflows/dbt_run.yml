name: dbt Validate & Parse

# This workflow validates dbt project syntax and parses models.
# For full dbt run/test against a warehouse, configure GitHub Secrets:
# - DBT_ACCOUNT, DBT_USER, DBT_PASSWORD, DBT_ROLE, DBT_DATABASE, DBT_WAREHOUSE
# See SETUP.md for configuration instructions.

on:
  push:
    branches: [main, develop]
    paths:
      - "models/**"
      - "macros/**"
      - "dbt_project.yml"
      - "packages.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  dbt-parse:
    name: Parse & Validate dbt Models
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dbt
        run: |
          pip install --upgrade pip
          pip install dbt-core dbt-postgres

      - name: Create dbt profiles directory
        run: mkdir -p ~/.dbt

      - name: Create minimal profiles.yml (validation only)
        run: |
          cat > ~/.dbt/profiles.yml << 'EOF'
          salesforce:
            target: dev
            outputs:
              dev:
                type: postgres
                host: localhost
                user: postgres
                password: postgres
                port: 5432
                dbname: postgres
                schema: public
                threads: 1
          EOF

      - name: Install dbt dependencies
        run: dbt deps

      - name: Validate dbt syntax and parse models
        run: dbt parse

      - name: Success - Project validated
        run: |
          echo "✅ dbt project syntax validated"
          echo "Models, macros, and configuration are well-formed"

  dbt-full-run:
    name: Full dbt Run (with Warehouse)
    runs-on: ubuntu-latest
    # Only run if GitHub Secrets are configured (manual trigger with secrets)
    if: github.event_name == 'workflow_dispatch' && secrets.DBT_ACCOUNT != ''

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dbt
        run: |
          pip install --upgrade pip
          pip install dbt-snowflake

      - name: Create dbt profiles directory
        run: mkdir -p ~/.dbt

      - name: Create profiles.yml with warehouse credentials
        run: |
          cat > ~/.dbt/profiles.yml << 'EOF'
          salesforce:
            target: prod
            outputs:
              prod:
                type: snowflake
                account: ${{ secrets.DBT_ACCOUNT }}
                user: ${{ secrets.DBT_USER }}
                password: ${{ secrets.DBT_PASSWORD }}
                role: ${{ secrets.DBT_ROLE }}
                database: ${{ secrets.DBT_DATABASE }}
                schema: prod
                warehouse: ${{ secrets.DBT_WAREHOUSE }}
                threads: 4
          EOF

      - name: dbt debug
        run: dbt debug

      - name: Install dependencies
        run: dbt deps

      - name: Run dbt models
        run: dbt run

      - name: Run dbt tests
        run: dbt test

      - name: Generate dbt documentation
        run: dbt docs generate

      - name: Upload documentation artifact
        uses: actions/upload-artifact@v3
        with:
          name: dbt-docs
          path: target/

      - name: Success
        if: success()
        run: echo "✅ Full dbt pipeline completed successfully"
