name: dbt PR Validation

on:
  pull_request:
    branches: [main, develop]
    paths:
      - "models/**"
      - "macros/**"
      - "dbt_project.yml"
      - "packages.yml"

jobs:
  dbt-parse:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dbt
        run: |
          pip install --upgrade pip
          pip install dbt-core dbt-postgres

      - name: Create dbt profiles directory
        run: mkdir -p ~/.dbt

      - name: Create profiles.yml (validation mode)
        run: |
          cat > ~/.dbt/profiles.yml << 'EOF'
          salesforce:
            target: dev
            outputs:
              dev:
                type: postgres
                host: localhost
                user: postgres
                password: postgres
                port: 5432
                dbname: postgres
                schema: public
                threads: 1
          EOF

      - name: Install dbt dependencies
        run: dbt deps

      - name: Validate dbt syntax
        run: dbt parse

      - name: Comment PR with validation result
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ dbt project validation passed\n\nSyntax and model structure validated. Ready to merge!'
            });
